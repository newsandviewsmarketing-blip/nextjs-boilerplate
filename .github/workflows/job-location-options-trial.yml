name: VetConnect isolated public location options regression

on:
  push:
    branches:
      - fix/job-location-tehsil-options-20261029

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'newsandviewsmarketing-blip/nextjs-boilerplate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Node 24 matching Vercel
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Repository audit
        run: npm run audit
      - name: Lint
        run: npm run lint
      - name: Real location matching and public dropdown regression tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build on isolated runner
        run: npm run build
      - name: Dependency security audit
        run: npm run security:audit
